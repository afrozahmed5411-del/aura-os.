
name: Build AURA OS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract source
        run: unzip -q AURA_OS_Android9_Source.zip -d source

      - name: Build APK
        working-directory: source/aura-os
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-OS-debug-APK
          path: source/aura-os/app/build/outputs/apk/debug/app-debug.apk
          
