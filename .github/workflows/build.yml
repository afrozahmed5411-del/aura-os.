
name: Build AURA OS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Extract AURA OS source
        run: |
          unzip -q AURA_OS_Android9_Source_v2.zip -d source

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
            \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build AURA OS
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload AURA OS APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-OS-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
