name: Build AURA OS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract AURA OS source
        run: |
          unzip -q AURA_OS_Android9_Source.zip -d source

      - name: Locate Android project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build AURA OS
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload AURA OS APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-OS-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
